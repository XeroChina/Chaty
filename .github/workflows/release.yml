# Windows x64 release: one tag → one GitHub Release carrying the Inno Setup
# installer (.exe) and the portable zip.
#
# The in-app updater (src-tauri/src/update.rs) reads the *latest* release and
# picks the asset by platform extension.
#
# Flow:
#   1. bump versions with scripts/bump-version.sh <x.y.z>
#   2. commit, tag v<x.y.z>, push the tag
#   3. this workflow builds both Windows artifacts and publishes the release
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # The commit every build here is made from, written into the app: a version
  # built again under the same number is told apart by it (src-tauri/src/update.rs).
  CHATY_BUILD: ${{ github.sha }}

jobs:
  # Fail fast if the tag doesn't match the versions in the repo.
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches package.json / tauri.conf.json / Cargo.toml
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "tag=$TAG pkg=$PKG conf=$CONF cargo=$CARGO"
          [ "$TAG" = "$PKG" ] && [ "$TAG" = "$CONF" ] && [ "$TAG" = "$CARGO" ] \
            || { echo "::error::version mismatch — run scripts/bump-version.sh $TAG"; exit 1; }

  build-windows:
    needs: check-version
    runs-on: windows-latest
    env:
      # Short target dir — the Vulkan build nests past MAX_PATH otherwise.
      CARGO_TARGET_DIR: C:\ct
      CMAKE_GENERATOR: Ninja
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v5
      # A git dependency is CLONED into `.cargo/git/checkouts/...`, where
      # llama.cpp's bundled web UI nests one character past MAX_PATH. The
      # crates.io release unpacked to a shorter path, so this only starts
      # mattering once the dependency is pinned to a revision. Long paths in
      # git, and cargo's fetch handed to that git rather than to libgit2.
      - name: Allow long paths for the llama.cpp checkout
        run: git config --global core.longpaths true
      - uses: actions/setup-node@v5
        with: { node-version: 20, cache: npm }
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - name: Install Vulkan SDK
        # LunarG keeps only its last ~16 SDKs downloadable: 1.3.290.0 went away
        # once the runner cache of it expired. Keep this pin recent, and the
        # runtime zip below on the same version. The installer is run headless,
        # as LunarG documents it: humbletim/install-vulkan-sdk unpacks it with
        # 7-Zip, which gets nothing out of the 1.4.3xx installers and still
        # reports success.
        shell: pwsh
        run: |
          $ver = "1.4.328.1"
          $exe = "$env:RUNNER_TEMP\vulkan_sdk.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkan_sdk.exe" -OutFile $exe
          $root = "C:\VulkanSDK\$ver"
          $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList @(
            "--root", $root, "--accept-licenses", "--default-answer", "--confirm-command", "install")
          if ($p.ExitCode -ne 0) { throw "Vulkan SDK installer exited $($p.ExitCode)" }
          foreach ($f in @("Include\vulkan\vulkan.h", "Lib\vulkan-1.lib", "Bin\glslc.exe")) {
            if (-not (Test-Path (Join-Path $root $f))) { throw "Vulkan SDK is missing $f" }
          }
          "VULKAN_SDK=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$root\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install Ninja
        run: choco install ninja -y
      - uses: ilammy/msvc-dev-cmd@v1 # load MSVC env so CMake/Ninja can find cl.exe
      - name: Install SPIRV-Headers (newer llama.cpp Vulkan needs its CMake config package)
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git
          cmake -S SPIRV-Headers -B SPIRV-Headers/build
          cmake --install SPIRV-Headers/build --prefix "$env:VULKAN_SDK"
      - run: npm ci
      - name: Build image engine sidecar (chaty-sd, Vulkan)
        shell: pwsh
        run: .\scripts\build-sd-sidecar.ps1 -Backend vulkan
        env:
          CMAKE_PREFIX_PATH: ${{ env.VULKAN_SDK }}
      - name: Build music engine sidecar (chaty-audio, Vulkan)
        shell: pwsh
        run: .\scripts\build-audio-sidecar.ps1 -Backend vulkan
        env:
          CMAKE_PREFIX_PATH: ${{ env.VULKAN_SDK }}
      - name: Build chaty.exe (Vulkan, no bundler)
        # The sd config layer makes tauri-build copy chaty-sd.exe and
        # chaty-audio.exe next to chaty.exe in the target dir, where the
        # installer picks them up.
        run: npm run tauri build -- --no-bundle --config src-tauri/tauri.sd.conf.json
        env:
          # newer llama.cpp's Vulkan backend does find_package(SPIRV-Headers/-Tools);
          # point CMake at the Vulkan SDK, which ships those config packages.
          CMAKE_PREFIX_PATH: ${{ env.VULKAN_SDK }}
      - name: Bundle Vulkan runtime loader (vulkan-1.dll)
        shell: pwsh
        run: |
          # Machines without a GPU driver (winget validation VMs, bare servers)
          # have no system vulkan-1.dll and the app fails to launch. Ship the
          # runtime loader next to the exe as a fallback (the system one wins
          # in the loader search order when present).
          $dll = Get-ChildItem -Recurse $env:VULKAN_SDK -Filter vulkan-1.dll -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '(x64|X64)' } |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $dll) {
            # SDK archives may omit the runtime component — fetch LunarG's
            # standalone runtime zip instead. LunarG names it
            # VulkanRT-X64-<ver>-Components.zip and drops old versions
            # (1.3.290.0 went away), so a pinned one is tried first, then the
            # latest: the loader is backward compatible.
            $ver = "1.4.328.1"
            $zip = "$env:TEMP\VulkanRT.zip"
            $urls = @(
              "https://sdk.lunarg.com/sdk/download/$ver/windows/VulkanRT-X64-$ver-Components.zip",
              "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-runtime-components.zip"
            )
            $got = $false
            foreach ($u in $urls) {
              try { Invoke-WebRequest $u -OutFile $zip; $got = $true; break }
              catch { Write-Host "Vulkan runtime: $u failed: $($_.Exception.Message)" }
            }
            if (-not $got) { throw "no Vulkan runtime download worked" }
            Expand-Archive $zip -DestinationPath "$env:TEMP\VulkanRT" -Force
            # The zip holds x86\ and x64\ copies under a folder named …X64…:
            # pick by the DLL's own folder, not by anything in its path.
            $dll = Get-ChildItem -Recurse "$env:TEMP\VulkanRT" -Filter vulkan-1.dll |
              Where-Object { $_.Directory.Name -ieq 'x64' } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $dll) { throw "vulkan-1.dll not found (SDK + runtime zip)" }
          Copy-Item $dll C:\ct\release\vulkan-1.dll
          Write-Host "bundled $dll"
      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $ver = "${env:GITHUB_REF_NAME}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DAppVersion=$ver /DSrcDir=C:\ct\release src-tauri\installer\Chaty.iss
      - uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: C:\ct\release\bundle\inno\*.exe
          if-no-files-found: error

      # The portable layout: a root chaty.exe that starts Program\chaty.exe, a
      # `portable` marker beside them that turns portable mode on, and Data\ for
      # every user file (src-tauri/src/portable.rs reads all three). Same
      # program files the installer gets, arranged differently.
      - name: Build launcher and pack the portable zip
        shell: pwsh
        working-directory: src-tauri
        run: |
          cargo build --release --bin chaty-launcher
          if ($LASTEXITCODE -ne 0) { throw "launcher build failed" }
          $ver = "${env:GITHUB_REF_NAME}".TrimStart("v")
          $stage = Join-Path $env:RUNNER_TEMP "chaty-portable"
          Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$stage\Program", "$stage\Data" | Out-Null
          $files = @(
            "chaty.exe", "chaty-llama.exe", "chaty-sd.exe", "chaty-audio.exe",
            "onnxruntime.dll", "onnxruntime_providers_shared.dll",
            "sherpa-onnx-c-api.dll", "sherpa-onnx-cxx-api.dll", "cargs.dll"
          )
          foreach ($f in $files) {
            if (-not (Test-Path "C:\ct\release\$f")) { throw "missing $f" }
            Copy-Item "C:\ct\release\$f" "$stage\Program"
          }
          # Normally the GPU driver provides this; bare machines get the loader.
          if (Test-Path C:\ct\release\vulkan-1.dll) {
            Copy-Item C:\ct\release\vulkan-1.dll "$stage\Program"
          }
          Copy-Item C:\ct\release\chaty-launcher.exe "$stage\chaty.exe"
          # Not empty: a named file with a line in it survives every extractor.
          Set-Content -Path "$stage\portable" -Value "Chaty portable layout: Program is the app, Data is its files."
          # tar (bsdtar), not Compress-Archive: it keeps the empty Data folder
          # the layout is built around, and it compresses the engines better.
          tar.exe -a -c -f "C:\ct\release\bundle\Chaty_${ver}_x64-portable.zip" -C $stage .
      - uses: actions/upload-artifact@v5
        with:
          name: windows-portable
          path: C:\ct\release\bundle\*portable.zip
          if-no-files-found: error

  publish:
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with: { pattern: "{windows-installer,windows-portable}", merge-multiple: true, path: dist }
      - name: Create GitHub Release with both Windows artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## A portable Windows copy

            The release carries `Chaty_*_x64-portable.zip` beside the installer. Unzip it anywhere
            and run `chaty.exe`: a launcher starts the program in `Program\`, and a `portable` marker
            beside them tells the app to keep everything it writes — settings, chats, models, logs
            and the embedded browser's own profile — in the `Data\` folder. Move the folder to another
            machine and it runs from there; delete it and nothing is left behind.

            ## Pasting a picture reads its text again

            The first paste of an image reads its text with the ocrs models, which used to be
            downloaded from an S3 bucket that has since been taken down — every first paste failed
            with a 403. They now come from the author's Hugging Face repository. Those models read
            Latin script only, so a Chinese page came back as Latin-looking gibberish; Windows' own
            OCR (`Windows.Media.Ocr`) now goes first and reads Chinese, falling back to the bundled
            models where the system has no Chinese recognizer.

            ## Under the hood

            Tauri moved from 2.11 to 2.12, and the `windows` and `webview2-com` dependencies were
            aligned with the ones its webview drives, so the window icons and the PDF export keep
            working against the same COM types.

            <!-- Highlights go above this line, hand-written per release —
                 the release page is where people who found Chaty through a
                 model's name land, and a bare install table tells them
                 nothing about why this version exists. -->

            ## Install

            | Platform | File |
            |---|---|
            | **Windows x64** | `Chaty_*_x64-setup.exe` — per-user installer, no admin |
            | **Windows x64 (portable)** | `Chaty_*_x64-portable.zip` — unzip anywhere and run `chaty.exe`; settings, chats and models stay in its `Data` folder |

            ---
      - name: Name the build the installers are, after them
        # The in-app updater offers this version built again by it
        # (src-tauri/src/update.rs). Uploaded last, so it never names a build
        # whose installers are still on their way.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '{"version":"%s","build":"%s"}\n' "${GITHUB_REF_NAME#v}" "$GITHUB_SHA" > chaty-build.json
          gh release upload "$GITHUB_REF_NAME" chaty-build.json --clobber --repo "$GITHUB_REPOSITORY"
